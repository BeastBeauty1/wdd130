    <h1>My Favorite City</h1>
    <p>My favorite city is Tokyo, Japan. As Japan's most populous city, Tokyo is known for its vibrant culture, impressive architecture, and bustling streets. It is also home to one of the world's most famous pedestrian crossings, the Shibuya Scramble Crossing. </p>
