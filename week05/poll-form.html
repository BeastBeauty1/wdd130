<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <meta name="author" content="Anthony Viehweg">
</head>
<body>
    <header>
      <h1>Poll Form</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                
                <label name="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label name="email">Email Address</label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>
        </form>
        <form>
            <fieldset>
                <legend>Questions</legend>

                <label for="browser">What is your favorite internet browser?</label>
                <select name="browser" id="select">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">      

                <label for="places">List all of the places you have lived:</label>
                <textarea id="places" name="places" rows="4" placeholder="Columbia South Carolina, Tokyo Japan, London England"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>
</html>
